[project]
name = "antarctic-viz"
version = "0.1.0"
description = "Streamlit web UI for exploring public Antarctic observation data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "altair>=5.0",
    "pandas>=2.0",
    "streamlit>=1.38",
]

[project.scripts]
antarctic-viz = "antarctic_viz.cli:main"

[dependency-groups]
dev = [
    "coverage>=7.0",
    "ruff>=0.16.8",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.13.0"]
build-backend = "uv_build"

[tool.coverage.run]
source = ["src/antarctic_viz", "tests"]
branch = true
relative_files = true
omit = ["src/antarctic_viz/cli.py"]

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
