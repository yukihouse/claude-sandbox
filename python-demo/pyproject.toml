[project]
name = "python-demo"
version = "0.1.0"
description = "カウンターデモアプリ（Python/Flask版）"
requires-python = ">=3.12"
dependencies = ["flask>=3.1.3"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
