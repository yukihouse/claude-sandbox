[project]
name = "gradio-ver"
version = "0.1.0"
description = "カウンターデモアプリ（Python/Gradio版）"
requires-python = ">=3.12"
dependencies = ["gradio>=5.49.1"]

[dependency-groups]
dev = ["pytest>=8.4.2", "pytest-cov>=7.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
