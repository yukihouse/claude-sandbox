<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>カウンターデモ (Python版)</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <h1>カウンターデモ (Python版)</h1>

    <p id="count">0</p>

    <p class="reaction" id="reaction">👋 +1ボタンを押してみてください</p>

    <div class="buttons">
      <button class="btn-increment" id="increment">+1</button>
      <button class="btn-reset" id="reset">リセット</button>
    </div>

    <nav class="nav">
      <a class="nav-link" href="http://localhost:8080/">ホームへ戻る</a>
    </nav>

    <script>
      let count = 0
      let lastClickAt = null
      const countEl = document.getElementById('count')
      const reactionEl = document.getElementById('reaction')

      document.getElementById('increment').addEventListener('click', async () => {
        count += 1
        countEl.textContent = count

        const now = performance.now()
        const intervalMs = lastClickAt === null ? null : Math.round(now - lastClickAt)
        lastClickAt = now

        const response = await fetch('/api/react', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ count, intervalMs }),
        })
        const data = await response.json()
        reactionEl.textContent = data.comment
      })

      document.getElementById('reset').addEventListener('click', () => {
        count = 0
        countEl.textContent = count
        lastClickAt = null
        reactionEl.textContent = '👋 +1ボタンを押してみてください'
      })
    </script>
  </body>
</html>
