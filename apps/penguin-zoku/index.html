<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ぺんぎん族</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#eaf2f6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 7 10' shape-rendering='crispEdges'%3E%3Cpath fill='%231b2430' d='M2 0h3v1h1v3h1v4H6v1H1V8H0V4h1V1h1z'/%3E%3Cpath fill='%23f4f8fb' d='M2 2h1v1H2zm2 0h1v1H4zM2 4h3v5H2z'/%3E%3Cpath fill='%23f29b30' d='M3 3h1v1H3zM1 9h2v1H1zm3 0h2v1H4z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700&display=swap">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="when">
      <h1 id="season">ぺんぎん族</h1>
      <span id="region">南極進化記</span>
    </div>
    <ul class="stats" id="stats" aria-label="群れの状態"></ul>
  </header>

  <div class="stage">
    <canvas id="scene" width="240" height="120" aria-label="群れのようす"></canvas>
  </div>

  <nav class="tabs" id="tabs" role="tablist" hidden>
    <button type="button" role="tab" data-tab="herd" id="tab-herd">群れ</button>
    <button type="button" role="tab" data-tab="land" id="tab-land">土地</button>
    <button type="button" role="tab" data-tab="tech" id="tab-tech">発明</button>
    <button type="button" role="tab" data-tab="log" id="tab-log">記録</button>
  </nav>

  <main id="view"></main>

  <footer class="dock" id="dock" hidden>
    <div class="dock-info" id="dockInfo"></div>
    <button type="button" class="primary" id="advance">季節をすすめる</button>
  </footer>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="backdrop" id="backdrop"></div>
  <section class="card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grip" aria-hidden="true"></div>
    <div id="sheetBody"></div>
  </section>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
