[project]
name = "exe-checker"
version = "0.1.0"
description = "CLI tool that checks whether a Windows .exe file has version information embedded"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
exe-checker = "exe_checker.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["exe_checker"]
branch = true
relative_files = true
omit = ["src/exe_checker/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
