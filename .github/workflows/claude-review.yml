name: Claude review

# Automated code review (including a security pass) on every PR.
# Uses a Claude Pro/Max subscription, not API credits: run `claude setup-token`
# locally and save the token as the repository secret CLAUDE_CODE_OAUTH_TOKEN.
# The job skips itself (and stays green) when the secret is not set.
# Runs count against the subscription's usage limits. Rules live in REVIEW.md.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code-review:
    # Secrets are unavailable to fork and Dependabot PRs; skip drafts too.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Check for API key
        id: key
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping Claude review."; fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 1

      - name: Review PR
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for correctness bugs. Follow REVIEW.md and the
            conventions in CLAUDE.md exactly (failure definitions, evidence with
            file:line, Important/Nit/Pre-existing tags, nit cap, skip list,
            re-review rounds). Also flag changes that make a line in CLAUDE.md or
            README.md out of date. Include security issues (secrets in code,
            unsafe subprocess/shell use, workflow permission or injection risks)
            as Important findings.

            Before commenting, read the existing review comments on the PR
            (`gh pr view --comments`) so you do not repeat a finding, and if you
            have reviewed before, focus on the commits pushed since then.

            Do not run the CLAUDE.md checks; CI's Lint and Coverage workflows run them.
            Drop findings that are only about style, diagnostics or cleanup.
            Post each finding as an inline comment, then one top-level summary
            comment that starts with the count (or "No issues found.").
            Do not approve the PR.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

