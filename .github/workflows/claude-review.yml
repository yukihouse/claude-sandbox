name: Claude review

# Automated code review + security review on every PR.
# Requires the repository secret ANTHROPIC_API_KEY; both jobs skip themselves
# (and stay green) when it is not set. Review rules live in REVIEW.md.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code-review:
    # Secrets are unavailable to fork and Dependabot PRs; skip drafts too.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Check for API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::ANTHROPIC_API_KEY is not set; skipping Claude review."; fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 1

      - name: Review PR
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for correctness bugs. Follow REVIEW.md and the
            conventions in CLAUDE.md exactly (failure definitions, evidence with
            file:line, Important/Nit/Pre-existing tags, nit cap, skip list,
            re-review rounds). Also flag changes that make a line in CLAUDE.md or
            README.md out of date.

            Before commenting, read the existing review comments on the PR
            (`gh pr view --comments`) so you do not repeat a finding, and if you
            have reviewed before, focus on the commits pushed since then.

            Drop findings that are only about style, diagnostics or cleanup.
            Post each finding as an inline comment, then one top-level summary
            comment that starts with the count (or "No issues found.").
            Do not approve the PR.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

  security-review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check for API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::ANTHROPIC_API_KEY is not set; skipping security review."; fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Security review
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-security-review@main
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          exclude-directories: antarctica-viz/tests/fixtures
