name: マージ済みブランチの自動削除

on:
  pull_request:
    types: [closed]
  schedule:
    # 毎週月曜 0:00 UTC に、PR経由でないマージなどの取りこぼしを一括掃除
    - cron: '0 0 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  delete-on-merge:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: マージ済みPRのheadブランチを削除
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const protectedBranches = ['main', 'master'];
            if (protectedBranches.includes(branch)) {
              core.info(`保護対象のブランチのためスキップ: ${branch}`);
              return;
            }
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              core.info(`削除しました: ${branch}`);
            } catch (error) {
              core.warning(`削除できませんでした (${branch}): ${error.message}`);
            }

  sweep-merged-branches:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: マージ済みブランチを一括削除
        uses: actions/github-script@v7
        with:
          script: |
            const protectedBranches = ['main', 'master'];

            const { data: repoInfo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const defaultBranch = repoInfo.default_branch;

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const openPRs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const branchesWithOpenPR = new Set(openPRs.map((pr) => pr.head.ref));

            for (const branch of branches) {
              const name = branch.name;
              if (name === defaultBranch || protectedBranches.includes(name)) continue;
              if (branchesWithOpenPR.has(name)) continue;

              // このブランチをheadとするマージ済みPRを検索
              const { data: searchResult } = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} type:pr is:merged head:${name}`,
              });
              if (searchResult.total_count === 0) continue;

              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${name}`,
                });
                core.info(`削除しました: ${name}`);
              } catch (error) {
                core.warning(`削除できませんでした (${name}): ${error.message}`);
              }
            }
