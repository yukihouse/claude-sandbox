name: hyogen-no-hoka Pages

# Publishes the game to GitHub Pages (https://<owner>.github.io/<repo>/).
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches:
      - main
    paths:
      - "apps/hyogen-no-hoka/**"
      - ".github/workflows/hyogen-no-hoka-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deployment that has started; queue the next one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hyogen-no-hoka
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/hyogen-no-hoka/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Same checks as hyogen-no-hoka.yml, so a commit that fails them is never published.
      - name: Type check
        run: npm run typecheck

      - name: Tests with coverage
        run: npm run coverage

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/hyogen-no-hoka/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
