name: hyogen-no-hoka

on:
  push:
    branches:
      - main
    paths:
      - "apps/hyogen-no-hoka/**"
      - ".github/workflows/hyogen-no-hoka.yml"
  pull_request:
    paths:
      - "apps/hyogen-no-hoka/**"
      - ".github/workflows/hyogen-no-hoka.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hyogen-no-hoka
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/hyogen-no-hoka/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests with coverage
        run: npm run coverage

      - name: Build
        run: npm run build
