name: Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  find-apps:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.list.outputs.projects }}
    steps:
      - uses: actions/checkout@v7

      # Every apps/<name>/ with a pyproject.toml is a Python app to lint.
      - name: List Python apps
        id: list
        run: |
          projects=$(ls apps/*/pyproject.toml | cut -d/ -f2 | jq -R . | jq -sc .)
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  ruff:
    needs: find-apps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.find-apps.outputs.projects) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Only the dev group (ruff at the locked version), not the app's runtime deps.
      - name: Ruff check
        run: uv run --locked --only-group dev ruff check .

      - name: Ruff format check
        run: uv run --locked --only-group dev ruff format --check .
