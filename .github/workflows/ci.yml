name: CI

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      vite: ${{ steps.filter.outputs.vite }}
      go: ${{ steps.filter.outputs.go }}
      csharp: ${{ steps.filter.outputs.csharp }}
      typescript: ${{ steps.filter.outputs.typescript }}
      python: ${{ steps.filter.outputs.python }}
      zig: ${{ steps.filter.outputs.zig }}
      zigPerf: ${{ steps.filter.outputs.zigPerf }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            vite:
              - 'vite-demo/**'
            go:
              - 'go-demo/**'
            csharp:
              - 'csharp-demo/**'
            typescript:
              - 'typescript-demo/**'
            python:
              - 'python-demo/**'
            zig:
              - 'zig-demo/**'
            zigPerf:
              - 'zig-demo/zig-perf-demo/**'
            rust:
              - 'rust-demo/**'

  test-and-lint:
    needs: changes
    if: needs.changes.outputs.vite == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vite-demo/package-lock.json

      - run: npm ci
        working-directory: vite-demo

      - name: 静的解析 (ESLint)
        run: npm run lint
        working-directory: vite-demo

      - name: 単体テスト (Vitest)
        run: npm run test
        working-directory: vite-demo

      - name: ビルド確認
        run: npm run build
        working-directory: vite-demo

  e2e-vite-demo:
    needs: changes
    if: needs.changes.outputs.vite == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vite-demo/package-lock.json

      - run: npm ci
        working-directory: vite-demo

      - name: Playwright ブラウザをインストール
        run: npx playwright install --with-deps chromium
        working-directory: vite-demo

      - name: E2Eテスト (Playwright)
        run: npm run test:e2e
        working-directory: vite-demo

      - name: レポートをアップロード
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: vite-demo/playwright-report/
          retention-days: 7

  go-demo:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: 静的解析 (go vet)
        run: go vet ./...
        working-directory: go-demo

      - name: 単体テスト
        run: go test ./...
        working-directory: go-demo

      - name: ビルド確認
        run: go build ./...
        working-directory: go-demo

  csharp-demo:
    needs: changes
    if: needs.changes.outputs.csharp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 単体テスト
        run: dotnet test
        working-directory: csharp-demo/CsharpDemo.Tests

  typescript-demo:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 型チェック
        run: deno check server.ts
        working-directory: typescript-demo

      - name: 単体テスト
        run: deno task test
        working-directory: typescript-demo

  python-demo:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          working-directory: python-demo

      - run: uv sync --locked
        working-directory: python-demo

      - name: 単体テスト
        run: uv run pytest
        working-directory: python-demo

  zig-demo:
    needs: changes
    if: needs.changes.outputs.zig == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Zig 0.15.2 をインストール
        run: |
          url=$(curl -fsSL https://ziglang.org/download/index.json | jq -r '.["0.15.2"]["x86_64-linux"].tarball')
          curl -fsSL "$url" -o /tmp/zig.tar.xz
          top_dir=$(tar -tf /tmp/zig.tar.xz | head -1 | cut -d/ -f1)
          tar -xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/$top_dir" >> "$GITHUB_PATH"

      - name: 単体テスト
        run: zig test src/main.zig
        working-directory: zig-demo

  zig-perf-demo:
    needs: changes
    if: needs.changes.outputs.zigPerf == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Zig 0.15.2 をインストール
        run: |
          url=$(curl -fsSL https://ziglang.org/download/index.json | jq -r '.["0.15.2"]["x86_64-linux"].tarball')
          curl -fsSL "$url" -o /tmp/zig.tar.xz
          top_dir=$(tar -tf /tmp/zig.tar.xz | head -1 | cut -d/ -f1)
          tar -xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/$top_dir" >> "$GITHUB_PATH"

      - name: 単体テスト
        run: zig test src/main.zig
        working-directory: zig-demo/zig-perf-demo

  rust-demo:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 静的解析 (Clippy)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: rust-demo

      - name: 単体テスト
        run: cargo test
        working-directory: rust-demo

      - name: ビルド確認
        run: cargo build
        working-directory: rust-demo
