name: CI

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      vite: ${{ steps.filter.outputs.vite }}
      go: ${{ steps.filter.outputs.go }}
      csharp: ${{ steps.filter.outputs.csharp }}
      typescript: ${{ steps.filter.outputs.typescript }}
      zig: ${{ steps.filter.outputs.zig }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            vite:
              - 'vite-demo/**'
            go:
              - 'go-demo/**'
            csharp:
              - 'csharp-demo/**'
            typescript:
              - 'typescript-demo/**'
            zig:
              - 'zig-demo/**'

  test-and-lint:
    needs: changes
    if: needs.changes.outputs.vite == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vite-demo/package-lock.json

      - run: npm ci
        working-directory: vite-demo

      - name: 静的解析 (ESLint)
        run: npm run lint
        working-directory: vite-demo

      - name: 単体テスト (Vitest)
        run: npm run test
        working-directory: vite-demo

      - name: ビルド確認
        run: npm run build
        working-directory: vite-demo

  go-demo:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: 静的解析 (go vet)
        run: go vet ./...
        working-directory: go-demo

      - name: 単体テスト
        run: go test ./...
        working-directory: go-demo

      - name: ビルド確認
        run: go build ./...
        working-directory: go-demo

  csharp-demo:
    needs: changes
    if: needs.changes.outputs.csharp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 単体テスト
        run: dotnet test
        working-directory: csharp-demo/CsharpDemo.Tests

  typescript-demo:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 型チェック
        run: deno check server.ts
        working-directory: typescript-demo

      - name: 単体テスト
        run: deno task test
        working-directory: typescript-demo

  zig-demo:
    needs: changes
    if: needs.changes.outputs.zig == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v1
        with:
          version: '0.15.2'

      - name: 単体テスト
        run: zig test src/main.zig
        working-directory: zig-demo
