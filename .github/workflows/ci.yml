name: CI

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      vite: ${{ steps.filter.outputs.vite }}
      go: ${{ steps.filter.outputs.go }}
      csharp: ${{ steps.filter.outputs.csharp }}
      typescript: ${{ steps.filter.outputs.typescript }}
      python: ${{ steps.filter.outputs.python }}
      pythonGradio: ${{ steps.filter.outputs.pythonGradio }}
      pythonNicegui: ${{ steps.filter.outputs.pythonNicegui }}
      zig: ${{ steps.filter.outputs.zig }}
      zigPerf: ${{ steps.filter.outputs.zigPerf }}
      rust: ${{ steps.filter.outputs.rust }}
      kotlin: ${{ steps.filter.outputs.kotlin }}
      php: ${{ steps.filter.outputs.php }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            vite:
              - 'vite-demo/**'
            go:
              - 'go-demo/**'
            csharp:
              - 'csharp-demo/**'
            typescript:
              - 'typescript-demo/**'
            python:
              - 'python-demo/**'
              - '!python-demo/gradio-ver/**'
              - '!python-demo/nicegui-ver/**'
            pythonGradio:
              - 'python-demo/gradio-ver/**'
            pythonNicegui:
              - 'python-demo/nicegui-ver/**'
            zig:
              - 'zig-demo/**'
            zigPerf:
              - 'zig-demo/zig-perf-demo/**'
            rust:
              - 'rust-demo/**'
            kotlin:
              - 'kotlin-demo/**'
            php:
              - 'php-demo/**'

  test-and-lint:
    needs: changes
    if: needs.changes.outputs.vite == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vite-demo/package-lock.json

      - run: npm ci
        working-directory: vite-demo

      - name: 静的解析 (ESLint)
        run: npm run lint
        working-directory: vite-demo

      - name: 単体テスト (Vitest) + カバレッジ計測
        run: npm run test:coverage
        working-directory: vite-demo

      - name: ビルド確認
        run: npm run build
        working-directory: vite-demo

  e2e-vite-demo:
    needs: changes
    if: needs.changes.outputs.vite == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vite-demo/package-lock.json

      - run: npm ci
        working-directory: vite-demo

      - name: Playwright ブラウザをインストール
        run: npx playwright install --with-deps chromium
        working-directory: vite-demo

      - name: E2Eテスト (Playwright)
        run: npm run test:e2e
        working-directory: vite-demo

      - name: レポートをアップロード
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: vite-demo/playwright-report/
          retention-days: 7

  go-demo:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: 静的解析 (go vet)
        run: go vet ./...
        working-directory: go-demo

      - name: 単体テスト + カバレッジ計測
        run: go test ./... -cover
        working-directory: go-demo

      - name: ビルド確認
        run: go build ./...
        working-directory: go-demo

  csharp-demo:
    needs: changes
    if: needs.changes.outputs.csharp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 単体テスト + カバレッジ計測
        run: dotnet test CsharpDemo.Tests --collect:"XPlat Code Coverage" --results-directory CsharpDemo.Tests/TestResults
        working-directory: csharp-demo

      - name: カバレッジレポート集計
        run: |
          dotnet tool restore
          dotnet tool run reportgenerator "-reports:CsharpDemo.Tests/TestResults/**/coverage.cobertura.xml" "-targetdir:coveragereport" "-reporttypes:TextSummary"
          cat coveragereport/Summary.txt
        working-directory: csharp-demo

  typescript-demo:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 型チェック
        run: deno check server.ts
        working-directory: typescript-demo

      - name: 単体テスト + カバレッジ計測
        run: deno task test:coverage
        working-directory: typescript-demo

  python-demo:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          working-directory: python-demo

      - run: uv sync --locked
        working-directory: python-demo

      - name: 単体テスト
        run: uv run pytest
        working-directory: python-demo

  python-gradio-demo:
    needs: changes
    if: needs.changes.outputs.pythonGradio == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          working-directory: python-demo/gradio-ver

      - run: uv sync --locked
        working-directory: python-demo/gradio-ver

      - name: 単体テスト
        run: uv run pytest
        working-directory: python-demo/gradio-ver

  python-nicegui-demo:
    needs: changes
    if: needs.changes.outputs.pythonNicegui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          working-directory: python-demo/nicegui-ver

      - run: uv sync --locked
        working-directory: python-demo/nicegui-ver

      - name: 単体テスト
        run: uv run pytest
        working-directory: python-demo/nicegui-ver

  zig-demo:
    needs: changes
    if: needs.changes.outputs.zig == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Zig 0.15.2 をインストール
        run: |
          url=$(curl -fsSL https://ziglang.org/download/index.json | jq -r '.["0.15.2"]["x86_64-linux"].tarball')
          curl -fsSL "$url" -o /tmp/zig.tar.xz
          top_dir=$(tar -tf /tmp/zig.tar.xz | head -1 | cut -d/ -f1)
          tar -xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/$top_dir" >> "$GITHUB_PATH"

      - name: 単体テスト
        run: zig test src/main.zig
        working-directory: zig-demo

  zig-perf-demo:
    needs: changes
    if: needs.changes.outputs.zigPerf == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Zig 0.15.2 をインストール
        run: |
          url=$(curl -fsSL https://ziglang.org/download/index.json | jq -r '.["0.15.2"]["x86_64-linux"].tarball')
          curl -fsSL "$url" -o /tmp/zig.tar.xz
          top_dir=$(tar -tf /tmp/zig.tar.xz | head -1 | cut -d/ -f1)
          tar -xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/$top_dir" >> "$GITHUB_PATH"

      - name: 単体テスト
        run: zig test src/main.zig
        working-directory: zig-demo/zig-perf-demo

  rust-demo:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 静的解析 (Clippy)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: rust-demo

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: 単体テスト + カバレッジ計測
        run: cargo llvm-cov --summary-only
        working-directory: rust-demo

      - name: ビルド確認
        run: cargo build
        working-directory: rust-demo

  kotlin-demo:
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 単体テスト + カバレッジ計測
        run: ./gradlew koverLog
        working-directory: kotlin-demo

      - name: ビルド確認
        run: ./gradlew build
        working-directory: kotlin-demo

  php-demo:
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov

      - run: composer install --no-interaction
        working-directory: php-demo

      - name: 単体テスト + カバレッジ計測
        run: composer run test:coverage
        working-directory: php-demo
