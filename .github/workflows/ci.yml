name: CI

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      vite: ${{ steps.filter.outputs.vite }}
      go: ${{ steps.filter.outputs.go }}
      csharp: ${{ steps.filter.outputs.csharp }}
      typescript: ${{ steps.filter.outputs.typescript }}
      python: ${{ steps.filter.outputs.python }}
      pythonGradio: ${{ steps.filter.outputs.pythonGradio }}
      pythonNicegui: ${{ steps.filter.outputs.pythonNicegui }}
      zig: ${{ steps.filter.outputs.zig }}
      zigPerf: ${{ steps.filter.outputs.zigPerf }}
      rust: ${{ steps.filter.outputs.rust }}
      kotlin: ${{ steps.filter.outputs.kotlin }}
      php: ${{ steps.filter.outputs.php }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            vite:
              - 'vite-demo/**'
            go:
              - 'go-demo/**'
            csharp:
              - 'csharp-demo/**'
            typescript:
              - 'typescript-demo/**'
            # dorny/paths-filter (picomatch) は正パターンと否定(!)パターンを1つのルールに
            # 混在させると、正パターンの制約が外れて全ファイルにマッチしてしまう既知の挙動が
            # あるため、'!python-demo/gradio-ver/**' のような除外ではなく列挙で対象を絞っている。
            python:
              - 'python-demo/*'
              - 'python-demo/static/**'
              - 'python-demo/templates/**'
              - 'python-demo/tests/**'
            pythonGradio:
              - 'python-demo/gradio-ver/**'
            pythonNicegui:
              - 'python-demo/nicegui-ver/**'
            zig:
              - 'zig-demo/**'
            zigPerf:
              - 'zig-demo/zig-perf-demo/**'
            rust:
              - 'rust-demo/**'
            kotlin:
              - 'kotlin-demo/**'
            php:
              - 'php-demo/**'

  test-and-lint:
    needs: changes
    if: needs.changes.outputs.vite == 'true'
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.cov.outputs.percent }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vite-demo/package-lock.json

      - run: npm ci
        working-directory: vite-demo

      - name: 静的解析 (ESLint)
        run: npm run lint
        working-directory: vite-demo

      - name: 単体テスト (Vitest) + カバレッジ計測
        id: cov
        run: |
          npm run test:coverage | tee coverage-output.txt
          pct=$(awk -F'|' '/All files/{gsub(/[ \t]/,"",$5); print $5"%"}' coverage-output.txt | head -1)
          if [ -z "$pct" ]; then
            pct=$(grep -oE 'Lines[[:space:]]*:[[:space:]]*[0-9.]+%' coverage-output.txt | grep -oE '[0-9.]+%' | head -1)
          fi
          echo "percent=${pct:-N/A}" >> "$GITHUB_OUTPUT"
        working-directory: vite-demo

      - name: ビルド確認
        run: npm run build
        working-directory: vite-demo

  e2e-vite-demo:
    needs: changes
    if: needs.changes.outputs.vite == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vite-demo/package-lock.json

      - run: npm ci
        working-directory: vite-demo

      - name: Playwright ブラウザをインストール
        run: npx playwright install --with-deps chromium
        working-directory: vite-demo

      - name: E2Eテスト (Playwright)
        run: npm run test:e2e
        working-directory: vite-demo

      - name: レポートをアップロード
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: vite-demo/playwright-report/
          retention-days: 7

  go-demo:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.cov.outputs.percent }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: 静的解析 (go vet)
        run: go vet ./...
        working-directory: go-demo

      - name: 単体テスト + カバレッジ計測
        id: cov
        run: |
          go test ./... -cover | tee coverage-output.txt
          pct=$(grep -oE 'coverage: [0-9.]+% of statements' coverage-output.txt | grep -oE '[0-9.]+%' | head -1)
          echo "percent=${pct:-N/A}" >> "$GITHUB_OUTPUT"
        working-directory: go-demo

      - name: ビルド確認
        run: go build ./...
        working-directory: go-demo

  csharp-demo:
    needs: changes
    if: needs.changes.outputs.csharp == 'true'
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.cov.outputs.percent }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 単体テスト + カバレッジ計測
        run: dotnet test CsharpDemo.Tests --collect:"XPlat Code Coverage" --results-directory CsharpDemo.Tests/TestResults
        working-directory: csharp-demo

      - name: カバレッジレポート集計
        id: cov
        run: |
          dotnet tool restore
          dotnet tool run reportgenerator "-reports:CsharpDemo.Tests/TestResults/**/coverage.cobertura.xml" "-targetdir:coveragereport" "-reporttypes:TextSummary"
          cat coveragereport/Summary.txt
          pct=$(grep -m1 'Line coverage:' coveragereport/Summary.txt | grep -oE '[0-9.]+%')
          echo "percent=${pct:-N/A}" >> "$GITHUB_OUTPUT"
        working-directory: csharp-demo

  typescript-demo:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.cov.outputs.percent }}
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 型チェック
        run: deno check server.ts
        working-directory: typescript-demo

      - name: 単体テスト + カバレッジ計測
        id: cov
        run: |
          deno test --allow-net --allow-read --coverage=coverage
          deno coverage coverage
          deno coverage coverage --lcov > coverage.lcov
          lf=$(grep -oP '(?<=^LF:)\d+' coverage.lcov | awk '{s+=$1} END{print s+0}')
          lh=$(grep -oP '(?<=^LH:)\d+' coverage.lcov | awk '{s+=$1} END{print s+0}')
          pct=$(awk -v lf="$lf" -v lh="$lh" 'BEGIN { if (lf > 0) printf "%.1f%%", (lh / lf) * 100; else print "N/A" }')
          echo "percent=${pct:-N/A}" >> "$GITHUB_OUTPUT"
        working-directory: typescript-demo

  python-demo:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.cov.outputs.percent }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          working-directory: python-demo

      - run: uv sync --locked
        working-directory: python-demo

      - name: 静的解析 (ruff)
        run: uv run ruff check .
        working-directory: python-demo

      - name: 単体テスト + カバレッジ計測
        id: cov
        run: |
          uv run pytest | tee coverage-output.txt
          pct=$(grep -m1 '^TOTAL' coverage-output.txt | grep -oE '[0-9]+%')
          echo "percent=${pct:-N/A}" >> "$GITHUB_OUTPUT"
        working-directory: python-demo

  python-gradio-demo:
    needs: changes
    if: needs.changes.outputs.pythonGradio == 'true'
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.cov.outputs.percent }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          working-directory: python-demo/gradio-ver

      - run: uv sync --locked
        working-directory: python-demo/gradio-ver

      - name: 静的解析 (ruff)
        run: uv run ruff check .
        working-directory: python-demo/gradio-ver

      - name: 単体テスト + カバレッジ計測
        id: cov
        run: |
          uv run pytest | tee coverage-output.txt
          pct=$(grep -m1 '^TOTAL' coverage-output.txt | grep -oE '[0-9]+%')
          echo "percent=${pct:-N/A}" >> "$GITHUB_OUTPUT"
        working-directory: python-demo/gradio-ver

  python-nicegui-demo:
    needs: changes
    if: needs.changes.outputs.pythonNicegui == 'true'
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.cov.outputs.percent }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          working-directory: python-demo/nicegui-ver

      - run: uv sync --locked
        working-directory: python-demo/nicegui-ver

      - name: 静的解析 (ruff)
        run: uv run ruff check .
        working-directory: python-demo/nicegui-ver

      - name: 単体テスト + カバレッジ計測
        id: cov
        run: |
          uv run pytest | tee coverage-output.txt
          pct=$(grep -m1 '^TOTAL' coverage-output.txt | grep -oE '[0-9]+%')
          echo "percent=${pct:-N/A}" >> "$GITHUB_OUTPUT"
        working-directory: python-demo/nicegui-ver

  zig-demo:
    needs: changes
    if: needs.changes.outputs.zig == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Zig 0.15.2 をインストール
        run: |
          url=$(curl -fsSL https://ziglang.org/download/index.json | jq -r '.["0.15.2"]["x86_64-linux"].tarball')
          curl -fsSL "$url" -o /tmp/zig.tar.xz
          top_dir=$(tar -tf /tmp/zig.tar.xz | head -1 | cut -d/ -f1)
          tar -xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/$top_dir" >> "$GITHUB_PATH"

      - name: 単体テスト
        run: zig test src/main.zig
        working-directory: zig-demo

  zig-perf-demo:
    needs: changes
    if: needs.changes.outputs.zigPerf == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Zig 0.15.2 をインストール
        run: |
          url=$(curl -fsSL https://ziglang.org/download/index.json | jq -r '.["0.15.2"]["x86_64-linux"].tarball')
          curl -fsSL "$url" -o /tmp/zig.tar.xz
          top_dir=$(tar -tf /tmp/zig.tar.xz | head -1 | cut -d/ -f1)
          tar -xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/$top_dir" >> "$GITHUB_PATH"

      - name: 単体テスト
        run: zig test src/main.zig
        working-directory: zig-demo/zig-perf-demo

  rust-demo:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.cov.outputs.percent }}
    steps:
      - uses: actions/checkout@v7

      - name: 静的解析 (Clippy)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: rust-demo

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: 単体テスト + カバレッジ計測
        id: cov
        run: |
          cargo llvm-cov --summary-only
          pct=$(cargo llvm-cov report --json | jq -r '.data[0].totals.lines.percent')
          echo "percent=$(printf '%.1f%%' "$pct")" >> "$GITHUB_OUTPUT"
        working-directory: rust-demo

      - name: ビルド確認
        run: cargo build
        working-directory: rust-demo

  kotlin-demo:
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.cov.outputs.percent }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 単体テスト + カバレッジ計測
        id: cov
        run: |
          ./gradlew koverLog | tee coverage-output.txt
          raw=$(grep -oE 'line coverage: [0-9.]+%' coverage-output.txt | grep -oE '[0-9.]+')
          pct=$([ -n "$raw" ] && printf '%.1f%%' "$raw")
          echo "percent=${pct:-N/A}" >> "$GITHUB_OUTPUT"
        working-directory: kotlin-demo

      - name: ビルド確認
        run: ./gradlew build
        working-directory: kotlin-demo

  php-demo:
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.cov.outputs.percent }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov

      - run: composer install --no-interaction
        working-directory: php-demo

      - name: 単体テスト + カバレッジ計測
        id: cov
        run: |
          composer run test:coverage | tee coverage-output.txt
          pct=$(grep -m1 'Lines:' coverage-output.txt | grep -oE '[0-9]+(\.[0-9]+)?%')
          echo "percent=${pct:-N/A}" >> "$GITHUB_OUTPUT"
        working-directory: php-demo

  coverage-comment:
    needs:
      - changes
      - test-and-lint
      - python-demo
      - python-gradio-demo
      - python-nicegui-demo
      - go-demo
      - csharp-demo
      - typescript-demo
      - rust-demo
      - kotlin-demo
      - php-demo
      - zig-demo
      - zig-perf-demo
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const changes = {
              vite: '${{ needs.changes.outputs.vite }}',
              python: '${{ needs.changes.outputs.python }}',
              pythonGradio: '${{ needs.changes.outputs.pythonGradio }}',
              pythonNicegui: '${{ needs.changes.outputs.pythonNicegui }}',
              go: '${{ needs.changes.outputs.go }}',
              csharp: '${{ needs.changes.outputs.csharp }}',
              typescript: '${{ needs.changes.outputs.typescript }}',
              rust: '${{ needs.changes.outputs.rust }}',
              kotlin: '${{ needs.changes.outputs.kotlin }}',
              php: '${{ needs.changes.outputs.php }}',
            };
            const rows = [
              ['vite-demo (Vitest)', changes.vite, "${{ needs['test-and-lint'].outputs.coverage }}"],
              ['python-demo (pytest)', changes.python, "${{ needs['python-demo'].outputs.coverage }}"],
              ['python-demo/gradio-ver (pytest)', changes.pythonGradio, "${{ needs['python-gradio-demo'].outputs.coverage }}"],
              ['python-demo/nicegui-ver (pytest)', changes.pythonNicegui, "${{ needs['python-nicegui-demo'].outputs.coverage }}"],
              ['go-demo', changes.go, "${{ needs['go-demo'].outputs.coverage }}"],
              ['csharp-demo (coverlet)', changes.csharp, "${{ needs['csharp-demo'].outputs.coverage }}"],
              ['typescript-demo (Deno)', changes.typescript, "${{ needs['typescript-demo'].outputs.coverage }}"],
              ['rust-demo (cargo-llvm-cov)', changes.rust, "${{ needs['rust-demo'].outputs.coverage }}"],
              ['kotlin-demo (Kover)', changes.kotlin, "${{ needs['kotlin-demo'].outputs.coverage }}"],
              ['php-demo (pcov)', changes.php, "${{ needs['php-demo'].outputs.coverage }}"],
            ];

            const lines = ['| デモ | 行カバレッジ |', '| --- | --- |'];
            for (const [name, changed, coverage] of rows) {
              const display = changed === 'true' ? (coverage && coverage.length > 0 ? coverage : 'N/A') : '_(変更なし)_';
              lines.push(`| ${name} | ${display} |`);
            }

            const marker = '<!-- coverage-report -->';
            const body = [
              marker,
              '### 📊 単体テストカバレッジ',
              '',
              ...lines,
              '',
              '_zig-demo / zig-perf-demo はカバレッジ計測ツール未対応のため対象外です（README参照）。_',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
