<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>カウンターデモ (PHP版)</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <h1>カウンターデモ (PHP版)</h1>

    <p id="count">0</p>

    <p class="persist-note">🔒 ブラウザを閉じても消えません（PHPセッションで30日間保持）</p>

    <div class="buttons">
      <button class="btn-increment" id="increment">+1</button>
      <button class="btn-reset" id="reset">リセット</button>
    </div>

    <nav class="nav">
      <a class="nav-link" href="http://localhost:8080/">ホームへ戻る</a>
    </nav>

    <script>
      const countEl = document.getElementById('count')

      async function syncCount(path, method) {
        const response = await fetch(path, { method })
        const { count } = await response.json()
        countEl.textContent = count
      }

      syncCount('/api/count', 'GET')

      document.getElementById('increment').addEventListener('click', () => {
        syncCount('/api/increment', 'POST')
      })

      document.getElementById('reset').addEventListener('click', () => {
        syncCount('/api/reset', 'POST')
      })
    </script>
  </body>
</html>
