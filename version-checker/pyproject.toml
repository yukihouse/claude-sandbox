[project]
name = "version-checker"
version = "0.1.0"
description = "CLI tool that checks whether a Windows .exe file has version information embedded"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
version-checker = "version_checker.cli:main"

[dependency-groups]
dev = [
    "coverage>=7.0",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.13.0"]
build-backend = "uv_build"

[tool.coverage.run]
source = ["version_checker"]
branch = true
relative_files = true
omit = ["src/version_checker/__main__.py"]

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
