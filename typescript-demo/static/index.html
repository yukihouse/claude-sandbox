<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>カウンターデモ (TypeScript版)</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <h1>カウンターデモ (TypeScript版)</h1>

    <p id="count">0</p>

    <p class="viewers-note">👥 <span id="viewers">-</span>人が同時に見ています（複数タブで開くと同期します）</p>

    <div class="buttons">
      <button class="btn-increment" id="increment">+1</button>
      <button class="btn-reset" id="reset">リセット</button>
    </div>

    <nav class="nav">
      <a class="nav-link" href="http://localhost:8080/">ホームへ戻る</a>
    </nav>

    <script>
      const countEl = document.getElementById('count')
      const viewersEl = document.getElementById('viewers')

      const socket = new WebSocket(`ws://${location.host}/ws`)

      socket.addEventListener('message', (event) => {
        const state = JSON.parse(event.data)
        countEl.textContent = state.count
        viewersEl.textContent = state.viewers
      })

      document.getElementById('increment').addEventListener('click', () => {
        socket.send(JSON.stringify({ type: 'increment' }))
      })

      document.getElementById('reset').addEventListener('click', () => {
        socket.send(JSON.stringify({ type: 'reset' }))
      })
    </script>
  </body>
</html>
