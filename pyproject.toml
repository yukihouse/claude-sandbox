[project]
name = "tetris"
version = "0.1.0"
description = "A terminal Tetris game used to demo PR test-coverage visualization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
streamlit = ["streamlit>=1.38"]

[project.scripts]
tetris = "tetris:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["tetris"]
branch = true
relative_files = true
omit = ["src/tetris/cli.py", "src/tetris/__main__.py", "src/tetris/streamlit_app.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
