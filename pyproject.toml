[project]
name = "tetris"
version = "0.1.0"
description = "A terminal Tetris game used to demo PR test-coverage visualization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
streamlit = ["streamlit>=1.38"]

[project.scripts]
tetris = "tetris:main"

[dependency-groups]
dev = [
    "coverage>=7.0",
    "ruff>=0.16.8",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.coverage.run]
source = ["tetris"]
branch = true
relative_files = true
omit = ["src/tetris/cli.py", "src/tetris/__main__.py", "src/tetris/streamlit_app.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
